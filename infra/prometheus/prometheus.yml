global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: producer
    static_configs: [{targets: ["producer:9102"]}]
  - job_name: processor
    static_configs: [{targets: ["processor:9100"]}]
  - job_name: api
    static_configs: [{targets: ["api-1:8000", "api-2:8000"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda-0:9644", "redpanda-1:9644", "redpanda-2:9644"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: containers
    static_configs: [{targets: ["ops-agent:8095"]}]
  - job_name: consul
    metrics_path: /v1/agent/metrics
    params: {format: [prometheus]}
    static_configs: [{targets: ["consul:8500"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
