# "Application Load Balancer": one entry point (http://localhost:8080).
#   /api/*  and /ws/*  -> round-robin across api-1 and api-2
#   /*                 -> dashboard (the virtual lab web app)
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_pool {
    zone api_pool 64k;
    server api-1:8000 resolve max_fails=1 fail_timeout=5s;
    server api-2:8000 resolve max_fails=1 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format alb '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log alb;
    client_max_body_size 2m;

    location = /alb/health { access_log off; return 200 "ok\n"; }
    location = /alb/status { stub_status; access_log off; }

    location /api/ {
        proxy_pass http://api_pool;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-ALB-Upstream $upstream_addr always;
    }

    location /ws/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        set $dash dashboard;
        proxy_pass http://$dash:80;
    }
}
