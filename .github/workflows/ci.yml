# CI: the same stages the lab runs locally (Experiment 12), on GitHub.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit -q

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install bandit==1.9.4
      - name: bandit (fails on HIGH severity)
        run: bandit -r services/swma --severity-level high
      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: services, severity: "CRITICAL,HIGH", exit-code: "0"}

  e2e:
    name: Integration tests (full stack)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: Wait until every component is healthy
        timeout-minutes: 8
        run: |
          until curl -fs localhost:8080/api/lab/status             | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(d['healthy'] != d['total'])"; do
            sleep 5
          done
      - name: Wait for the first final windows (needed by the correctness test)
        timeout-minutes: 5
        run: |
          until curl -fs localhost:8080/api/lab/correctness             | python3 -c "import sys,json; sys.exit(json.load(sys.stdin)['checked'] == 0)"; do
            sleep 10
          done
      - name: End-to-end tests
        run: docker compose exec -T -e STREAMLAB_E2E=1 api-1 python -m pytest tests/e2e -v
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          curl -s localhost:8080/api/lab/status || true
          curl -s localhost:8080/api/lab/correctness || true
          docker compose logs --tail 60 bootstrap processor producer api-1
      - run: docker compose down -v

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      matrix:
        include:
          - {name: producer, context: services, target: producer}
          - {name: processor, context: services, target: processor}
          - {name: api, context: services, target: api}
          - {name: ops-agent, context: services, target: ops-agent}
          - {name: dashboard, context: portal, target: ""}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          tags: swma/${{ matrix.name }}:${{ github.sha }}
